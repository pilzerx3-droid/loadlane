<!DOCTYPE html>

<style>

.ev li{display:flex;gap:12px;padding:5px 0;color:var(--mu);font-size:13px}.ev time{color:var(--ink);font-weight:600;min-width:70px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}

.dtbl .tr{grid-template-columns:minmax(0,1.5fr) 104px 104px 110px}

.phone{max-width:340px;margin:18px auto 0;border:2px solid var(--ink);border-radius:30px;padding:24px 18px;background:var(--pn);text-align:center}

.qres .src b{font-variant-numeric:tabular-nums}.qres .big{font-size:30px;font-weight:600;letter-spacing:-.04em;margin:2px 0 6px}

#tour{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:16px;padding:16px 18px;z-index:30;box-shadow:0 14px 44px rgba(0,0,0,.3)}
#tour[hidden]{display:none}
#tour small{opacity:.7;font:600 11px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase}
#tour h4{font-size:18px;margin:6px 0 4px}#tour p{margin:0 0 12px;opacity:.85}
#tour .tb{display:flex;gap:8px;align-items:center}#tour .tb .sp{flex:1}
#tour .btn.g{background:transparent;color:inherit;border-color:rgba(127,127,127,.55)}
#tour .lk{background:none;border:0;color:inherit;opacity:.7;font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.tour-hl{outline:2px solid var(--ink);outline-offset:4px;box-shadow:0 0 0 7px color-mix(in srgb,var(--lime) 70%,transparent);border-radius:14px;scroll-margin:100px 0 260px}

@media (max-width:600px){.tr.ovr{grid-template-columns:1fr;gap:4px}.tr.ovr .r{white-space:normal}.fgrid{grid-template-columns:1fr}}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1.5fr 1fr}.split{grid-template-columns:1fr 1.15fr;align-items:start}.d3{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;gap:4px;align-items:center}.logo{flex:none;margin:0 10px 0 2px}.nv{flex:none}.ws{display:none}.main{padding:18px 16px 60px}.dtbl .tr{grid-template-columns:minmax(0,1.4fr) 100px 100px}.dtbl .tr .c4{display:none}}

<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tour" role="region" aria-label="Guided tour" hidden></div>
<script>
(function(){
var STEPS=["Gate check-in","Loading","Weighing","Departure","On the road","Delivered"];
var DOCTYPES=["Weighing ticket","Bill of lading","Proof of delivery","Customs papers","Invoice"];
var AUTO={2:["Weighing ticket","Scale API"],3:["Bill of lading","Email bot"],5:["Proof of delivery","Driver link"]};
var KEY="ll_app_v4",TKEY="ll_theme";
var TABS=["overview","loads","documents","quotes","carriers","alerts","integrations","driver"];
var NAV=[["overview","Overview"],["loads","Loads"],["documents","Documents"],["quotes","Quotes"],["carriers","Carriers"],["alerts","Alerts"],["integrations","Integrations"],["driver","Driver link"]];
var lastT={},mounts=[],T=-1,shownT=-2,fresh=false;
var LANES=[["Houston plant","Dallas DC",240],["Houston plant","Austin DC",165],["Houston plant","Memphis DC",585],["Baton Rouge plant","Nashville DC",700],["Baton Rouge plant","Atlanta DC",640],["Houston plant","Chicago DC",1085]];
var EQUIP=[["Dry van",2.25],["Reefer",2.65],["Flatbed",2.55],["Tanker",3.10]];

function fmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+(mm<10?"0":"")+mm+" "+ap}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function now(){return fmt(nowMin())}
function mk(ref,from,to,carrier,step,eta,late,docs,miles,conf){
  var l={ref:ref,from:from,to:to,carrier:carrier,step:step,eta:eta,delay:late?25:0,late:!!late,miles:miles,confirmed:!!conf,notified:false,reqd:false,docs:[],ev:[]};
  (docs||[]).forEach(function(d){l.docs.push({n:d[0],s:d[1],t:"Earlier"})});
  l.ev.push({t:"Earlier",x:"Reached: "+STEPS[step],s:"Dispatch"});return l;
}
function seed(){return{loads:[
  mk("LL-48213","Houston plant","Chicago DC","Lone Star Freight",4,570,false,[["Check-in receipt","Driver link"],["Weighing ticket","Scale API"],["Bill of lading","Email bot"]],1085,true),
  mk("LL-48214","Baton Rouge plant","Atlanta DC","Great Lakes Haul",1,780,true,[["Check-in receipt","Driver link"]],640,true),
  mk("LL-48215","Houston plant","Dallas DC","Prairie Express",0,1140,false,[],240,false),
  mk("LL-48217","Houston plant","Austin DC","Lone Star Freight",2,700,false,[["Check-in receipt","Driver link"]],165,true),
  mk("LL-48216","Houston plant","Memphis DC","Lone Star Freight",5,300,false,[["Weighing ticket","Scale API"],["Bill of lading","Email bot"],["Proof of delivery","Driver link"]],585,true)
 ],inbox:[{f:"scan_0098.pdf",s:"Email bot",t:"Earlier"}],
 carriers:[{n:"Lone Star Freight",on:96,c:"dispatch@lonestar.example"},{n:"Great Lakes Haul",on:91,c:"ops@greatlakes.example"},{n:"Prairie Express",on:84,c:"desk@prairie.example"}],
 perDay:[3,5,4,7,6,8],sel:"LL-48213",filter:"all",q:"",dfilter:"all",method:"email",driver:"LL-48215",newForm:false,quotes:[],qd:defQd()}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.loads&&o.inbox&&o.carriers)return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load();S.quotes=S.quotes||[];S.qd=S.qd||defQd();

function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){var v=a[x];if(v===null||v===undefined)continue;if(x==="class")e.className=v;else if(x==="text")e.textContent=v;else if(x.slice(0,2)==="on")e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}(k||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
var toastT;function say(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},2600)}
function go(h){if(location.hash==="#"+h)render();else location.hash="#"+h}
function get(ref){for(var i=0;i<S.loads.length;i++)if(S.loads[i].ref===ref)return S.loads[i];return null}
function etaOf(l){return l.step===5?"Delivered":fmt(l.eta+(l.delay||0))}
function hasDoc(l,n){return l.docs.some(function(d){return d.n===n})}
function addDoc(l,n,s){l.docs.push({n:n,s:s,t:now()})}
function logEv(l,x,s){l.ev.unshift({t:now(),x:x,s:s})}
function active(){return S.loads.filter(function(l){return l.step<5})}
function advance(l,src){
  if(l.step>=5)return;l.step++;logEv(l,"Step: "+STEPS[l.step],src);
  var a=AUTO[l.step];if(a&&!hasDoc(l,a[0])){addDoc(l,a[0],a[1]);logEv(l,"Document attached: "+a[0],a[1])}
  if(l.step===5){l.late=false;l.delay=0}save();
}
function alerts(){var a=[];
  S.loads.forEach(function(l){
    if(l.step<5&&l.late)a.push({k:"late",l:l,t:l.ref+" is running "+l.delay+" min late",d:"New ETA "+etaOf(l)+(l.notified?" · customer notified":""),act:l.notified?null:"Notify customer"});
    if(l.step>=2&&l.step<5&&!hasDoc(l,"Weighing ticket"))a.push({k:"doc",l:l,t:"Weighing ticket missing",d:l.ref+" · "+l.carrier+(l.reqd?" · requested":""),act:l.reqd?null:"Request ticket"});
    if(l.step===0&&!l.confirmed)a.push({k:"pick",l:l,t:"Send pickup confirmation",d:l.ref+" · "+l.from,act:"Send"});
  });
  S.inbox.forEach(function(d,i){a.push({k:"inb",i:i,t:"Document needs review",d:d.f+" · "+d.s,act:"Review"})});
  return a;
}
function doAlert(a){
  if(a.k==="late"){a.l.notified=true;logEv(a.l,"Customer notified of delay","Dispatch");say("Customer notified")}
  else if(a.k==="doc"){a.l.reqd=true;logEv(a.l,"Weighing ticket requested","Dispatch");say("Requested from gate")}
  else if(a.k==="pick"){a.l.confirmed=true;logEv(a.l,"Pickup confirmation sent","Dispatch");say("Confirmation sent")}
  else{go("documents");return}
  save();render();
}
function chips(l){var c=[el("span",{class:"chip"+(l.step===5?" ok":""),text:STEPS[l.step]})];if(l.late&&l.step<5)c.push(el("span",{class:"chip late",text:"Late +"+l.delay+" min"}));return c}
function seg(l){var s=el("span",{class:"seg","aria-hidden":"true"});for(var i=0;i<6;i++)s.appendChild(el("i",{class:i<=l.step?"on":""}));return s}
function open(ref){S.sel=ref;save();go("loads")}
function fname(d,l){return /\.[a-z0-9]{2,4}$/i.test(d.n)?d.n:d.n.toLowerCase().replace(/[^a-z0-9]+/g,"_")+"_"+l.ref.slice(-4)+".pdf"}

/* ---------- Overview ---------- */
function vOverview(){
